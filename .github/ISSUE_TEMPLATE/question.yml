name: Question
description: Here you can ask questions 
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Development of this project has ended

        This library depends on the legacy Eufy API, which Eufy is shutting down.
        Once it is gone, no amount of patching here will keep this working.

        **Issues and feature requests are no longer picked up.** Anything opened
        here will most likely be closed without a fix.

        A new integration built around Eufy Mega is in development. Please follow
        that instead: [Discord](https://discord.gg/5wjQ2asb64)

  - type: textarea
    id: question
    attributes:
      label: Ask your question
      description: A clear and concise question
      placeholder: Is it possible to make coffee with this adapter?
    validations:
      required: true